name: Build and test

# Builds the Windows installer and tests the app on a clean Windows machine.
# - every push to main: build the installer (kept as a workflow artifact) and
#   run the light-engine test
# - every push to main also puts the installer on a DRAFT release named after
#   VERSION (v0.3.0, ...). A draft stays private until it is published by hand.
# - "Run workflow" button: choose which engines to test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      engines:
        description: "Engines to install and test (lite, chatterbox, openvoice)"
        default: "lite"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$v" installer\voicestudio.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-Setup
          path: dist/*.exe
      - name: Put the installer on a draft release for this version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft release is private until it is published by hand on GitHub.
          $v = (Get-Content VERSION -Raw).Trim()
          $tag = "v$v"
          $exe = (Get-ChildItem dist\*.exe).FullName
          $rel = gh release list --limit 50 --json tagName,isDraft | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag }
          if (-not $rel) {
            gh release create $tag $exe --draft --target $env:GITHUB_SHA --title "Voice Studio $v" --notes "Download VoiceStudio-Setup-$v.exe and run it. Windows shows an 'unknown publisher' notice because the installer is not code-signed: choose More info, then Run anyway. The installer downloads the voice engines you tick (2 to 16 GB)."
          } elseif ($rel.isDraft) {
            gh release upload $tag $exe --clobber
          } else {
            Write-Host "Release $tag is already published. Change VERSION to make a new one."
          }

  test:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Setup exactly as a new PC would
        shell: pwsh
        run: |
          $engines = "${{ github.event.inputs.engines }}"
          if (-not $engines) { $engines = "lite" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -Yes -NoShortcut -Engines $engines
          if ($LASTEXITCODE -ne 0) { Get-ChildItem C:\Temp\VoiceStudio_Setup_* | ForEach-Object { Get-Content "$($_.FullName)\setup.log" -Tail 80 }; exit 1 }
      - name: Generate speech with each engine
        shell: pwsh
        run: |
          $engines = "${{ github.event.inputs.engines }}"
          if (-not $engines) { $engines = "lite" }
          $list = @()
          if ($engines -match "lite") { $list += "kokoro", "pocket" }
          if ($engines -match "openvoice") { $list += "openvoice" }
          if ($engines -match "chatterbox") { $list += "chatterbox" }
          & .\runtime\Scripts\python.exe tools\smoke_test.py @list
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          Copy-Item C:\Temp\VoiceStudio_Setup_*\* ci-logs -ErrorAction SilentlyContinue
          Copy-Item models\fetch_*.log ci-logs -ErrorAction SilentlyContinue
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ci-logs
          if-no-files-found: ignore
